# tmux 3.7c

# User specific options
bind S setw synchronize-panes

# Available server options are:
# set  -g backspace #key
# set  -g buffer-limit #number
# set  -g command-alias[] #name=value
# set  -g codepoint-widths[] #string
# set  -g copy-command #shell-command
# set  -g default-client-command #command
# set  -g default-terminal #terminal
# set  -g escape-time #time
# set  -g editor #shell-command
# set  -g exit-empty #[on | off]
# set  -g exit-unattached #[on | off]
# set  -g extended-keys #[on | off | always]
# set  -g extended-keys-format #[csi-u | xterm]
# set  -g focus-events #[on | off]
# set  -g focus-follows-mouse #[on | off]
# set  -g get-clipboard #[both | request | buffer | off]
# set  -g history-file #path
# set  -g input-buffer-size #bytes
# set  -g message-limit #number
# set  -g prompt-history-limit #number
# set  -g set-clipboard #[on | external | off]
# set  -g terminal-features[] #string
# set  -g terminal-overrides[] #string
# set  -g user-keys[] #key
# set  -g variation-selector-always-wide #[on | off]

# Available session options are:
# set  -g activity-action #[any | none | current | other]
# set  -g assume-paste-time #milliseconds
set  -g base-index 1 #index
set  -g bell-action none #[any | none | current | other]
# set  -g default-command #shell-command
# set  -g default-shell #path
# set  -g default-size #XxY
# set  -g destroy-unattached #[off | on | keep-last | keep-group]
# set  -g detach-on-destroy #[off | on | no-detached | previous | next]
# set  -g display-panes-active-colour #colour
# set  -g display-panes-colour #colour
# set  -g display-panes-time #time
# set  -g display-time #time
# set  -g history-limit #lines
# set  -g initial-repeat-time #time
# set  -g key-table #key-table
# set  -g lock-after-time #number
# set  -g lock-command #shell-command
# set  -g menu-style #style
# set  -g menu-selected-style #style
# set  -g menu-border-style #style
# set  -g menu-border-lines #type
# set  -g message-command-style #style
# set  -g message-format #string
# set  -g message-line #[0 | 1 | 2 | 3 | 4]
# set  -g message-style #style
set  -g mouse on #[on | off]
set  -g prefix C-a #key
# set  -g prefix2 #key
# set  -g prefix-timeout #time
# set  -g prompt-cursor-colour #colour
# set  -g prompt-cursor-style #style
# set  -g prompt-command-cursor-style #style
set  -g renumber-windows on #[on | off]
# set  -g repeat-time #time
set  -g set-titles on #[on | off]
# set  -g set-titles-string #string
# set  -g silence-action #[any | none | current | other]
# set  -g status #[off | on | 2 | 3 | 4 | 5]
# set  -g status-format[] #format
# set  -g status-interval #interval
# set  -g status-justify #[left | centre | right | absolute-centre]
set  -g status-keys vi #[vi | emacs]
# set  -g status-left #string
# set  -g status-left-length #length
# set  -g status-left-style #style
set  -g status-position top #[top | bottom]
# set  -g status-right #string
# set  -g status-right-length #length
# set  -g status-right-style #style
# set  -g status-style #style
# set  -g update-environment[] #variable
# set  -g visual-activity #[on | off | both]
# set  -g visual-bell #[on | off | both]
# set  -g visual-silence #[on | off | both]
# set  -g word-separators #string

# Available window options are:
setw -g aggressive-resize on #[on | off]
setw -g automatic-rename on #[on | off]
# setw -g automatic-rename-format #format
# setw -g clock-mode-colour #colour
setw -g clock-mode-style 24-with-seconds #[12 | 24 | 12-with-seconds | 24-with-seconds]
# setw -g fill-character #character
# setw -g main-pane-height #height
# setw -g main-pane-width #width
# setw -g copy-mode-match-style #style
# setw -g copy-mode-mark-style #style
# setw -g copy-mode-current-match-style #style
# setw -g copy-mode-position-format #format
# setw -g copy-mode-position-style #style
# setw -g copy-mode-selection-style #style
# setw -g copy-mode-current-line-number-style #style
# setw -g copy-mode-line-number-style #style
# setw -g copy-mode-line-numbers #[off | default | absolute | relative | hybrid]
setw -g mode-keys vi #[vi | emacs]
# setw -g mode-style #style
# setw -g monitor-activity #[on | off]
# setw -g monitor-bell #[on | off]
# setw -g monitor-silence #[interval]
# setw -g other-pane-height #height
# setw -g other-pane-width #width
# setw -g pane-active-border-style #style
setw -g pane-base-index 1 #index
# setw -g pane-border-format #format
# setw -g pane-border-indicators #[off | colour | arrows | both]
setw -g pane-border-lines heavy #type
setw -g pane-border-status top #[off | top | bottom]
# setw -g pane-border-style #style
# setw -g popup-style #style
# setw -g popup-border-style #style
# setw -g popup-border-lines #type
setw -g pane-scrollbars modal #[off | modal | on]
# setw -g pane-scrollbars-style #style
# setw -g pane-scrollbars-position #[left | right]
# setw -g pane-status-current-style #style
# setw -g pane-status-style #style
# setw -g session-status-current-style #style
# setw -g session-status-style #style
# setw -g tiled-layout-max-columns #number
# setw -g tree-mode-preview-format #format
# setw -g tree-mode-preview-style #style
# setw -g window-status-activity-style #style
# setw -g window-status-bell-style #style
# setw -g window-status-current-format #string
# setw -g window-status-current-style #style
# setw -g window-status-format #string
# setw -g window-status-last-style #style
# setw -g window-status-separator #string
# setw -g window-status-style #style
setw -g window-size latest #largest | smallest | manual | latest
# setw -g wrap-search #[on | off]

# Available pane options are:
# setw -g allow-passthrough #[on | off | all]
setw -g allow-rename on #[on | off]
setw -g allow-set-title on #[on | off]
# setw -g alternate-screen #[on | off]
# setw -g cursor-colour #colour
# setw -g cursor-style #style
# setw -g pane-colours[] #colour
# setw -g remain-on-exit #[on | off | failed | key]
# setw -g remain-on-exit-format #string
# setw -g scroll-on-clear #[on | off]
# setw -g synchronize-panes #[on | off]
# setw -g window-active-style #style
# setw -g window-style #style
# setw -g window-pane-status-format #string
# setw -g window-pane-current-status-format #string

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'erikw/tmux-powerline'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
